/* ---------------- Eigene Bausteine ---------------- */
const modOf = c => App.modules.find(m => m.id === c.props.mid);
function modLayout(c) {
  const M = modOf(c); const n = M ? M.ins.length : 0, m = M ? M.outs.length : 0;
  const H = Math.max(n, m, 1), top = -Math.floor((H - 1) / 2);
  const oi = Math.floor((H - n) / 2), oo = Math.floor((H - m) / 2);
  return { M, ins: Array.from({ length: n }, (_, i) => top + oi + i), outs: Array.from({ length: m }, (_, i) => top + oo + i), y0: top - 1.4, y1: top + H - 1 + 0.7 };
}
def('mod', {
  mode: 'digital', cat: 'Eigene Bausteine', name: 'Eigener Baustein', noLabel: true, defaults: { mid: '' },
  pins(c) { const L = modLayout(c); if (!L.M) return []; return [...L.ins.map((y, i) => ({ x: -3, y, dir: 'in', name: L.M.ins[i] })), ...L.outs.map((y, i) => ({ x: 3, y, dir: 'out', name: L.M.outs[i] }))]; },
  box(c) { const L = modLayout(c); return [-2.5, L.y0, 2.5, L.y1]; },
  evalD(c, ins) {
    const M = modOf(c); if (!M) return [];
    if (!c.st.sub || c.st.ver !== M.ver) {
      if (M.busy) return M.outs.map(() => 0); // Schutz gegen Selbstbezug
      M.busy = 1;
      try {
        const cc = deserialize(M.circuit);
        const pos = (a, b) => a.y - b.y || a.x - b.x;
        c.st.sub = dMake(cc); c.st.ver = M.ver;
        c.st.sin = cc.comps.filter(q => q.type === 'switch' || q.type === 'button').sort(pos);
        c.st.sout = cc.comps.filter(q => q.type === 'led').sort(pos);
      } finally { M.busy = 0; }
    }
    const S = c.st.sub;
    c.st.sin.forEach((q, i) => { if (q.type === 'switch') q.props.on = ins[i] ? 1 : 0; else q.st.p = ins[i] ? 1 : 0; });
    dSettleS(S, 200);
    return c.st.sout.map(q => S.nv[S.net.compNodes.get(q.id)[0]] === 1 ? 1 : 0);
  },
  draw(ctx, c, R) {
    const L = modLayout(c), M = L.M;
    L.ins.forEach((y, i) => R.lead(-3, y, -2.5, y, i));
    L.outs.forEach((y, k) => R.lead(2.5, y, 3, y, L.ins.length + k));
    rr(ctx, -2.5, L.y0, 5, L.y1 - L.y0, 0.15); body(ctx, M ? '#f3f7ff' : '#ffecec');
    ctx.strokeStyle = '#b8c6e3'; ctx.lineWidth = 0.06; ln(ctx, -2.5, L.y0 + 1.05, 2.5, L.y0 + 1.05);
    R.text(M ? (M.sym || M.name) : '? fehlt', 0, L.y0 + 0.55, { size: 11, bold: true, color: M ? '#1f3f8a' : '#c92a2a' });
    if (!M) return;
    L.ins.forEach((y, i) => R.text(M.ins[i], -2.3, y, { size: 8.5, align: 'left', color: '#475467' }));
    L.outs.forEach((y, i) => R.text(M.outs[i], 2.3, y, { size: 8.5, align: 'right', color: '#475467' }));
  },
  editBtn: true,
});

/* ================= Analog / Halbleiter ================= */
const twoPins = () => [{ x: -2, y: 0, name: 'Anschluss 1' }, { x: 2, y: 0, name: 'Anschluss 2' }];
const twoBox = () => [-1.6, -0.8, 1.6, 0.8];
function meas2(c, unitless) {
  const N = App.net.compNodes.get(c.id);
  const U = nodeV(N[0]) - nodeV(N[1]), I = c.st.pinI ? c.st.pinI[0] : 0;
  return [['Spannung U', fmtSI(U, 'V')], ['Stromstärke I', fmtSI(Math.abs(I) < 1e-12 ? 0 : I, 'A')], ['Leistung P', fmtSI(Math.abs(U * I), 'W')]];
}
function resStamp(R) {
  return {
    stamp(c, N, S) { sG(S, N[0], N[1], 1 / R(c)); },
    post(c, N, P) { const I = (Vn(P, N[0]) - Vn(P, N[1])) / R(c); c.st.pinI = [I, -I]; c.st.P = Math.abs(I * I * R(c)); },
  };
}
function drawRes(ctx, c, R, fill) {
  R.lead(-2, 0, -1.2, 0, 0); R.lead(1.2, 0, 2, 0, 1);
  rr(ctx, -1.2, -0.42, 2.4, 0.84, 0.04); body(ctx, fill || COL.body);
}

def('lamp', {
  mode: 'analog', cat: 'Bauteile', name: 'Glühlampe', prefix: 'L',
  props: [{ key: 'Un', label: 'Nennspannung', type: 'num', unit: 'V', def: 6 }, { key: 'Pn', label: 'Nennleistung', type: 'num', unit: 'W', def: 0.5 }],

/* --- Dioden --- */
const ledIs = vf => 0.02 / Math.exp(vf / (2 * VT));
const LEDVF = { red: 1.8, green: 2.1, yellow: 2.0, blue: 3.0, white: 3.1 };
function dParams(c) {
  if (c.type === 'aled') return { Is: ledIs(LEDVF[c.props.color]), nvt: 2 * VT };
  if (c.type === 'zener') return { Is: 2.5e-9, nvt: 1.75 * VT, vz: c.props.Vz, Isr: 5e-3, nvtr: 0.06 };
  return { Is: 2.5e-9, nvt: 1.75 * VT };
}
function dIV(v, p) {

  ${dig ? '<h4>Werkzeuge (⋯-Menü)</h4><p><b>Schaltung aus Term erzeugen</b> (auch nur aus NAND oder NOR) und <b>Aufgabe erstellen</b>: Aus einer Musterlösung entsteht eine Aufgabendatei, deren Lösung die Schülerinnen und Schüler mit „Prüfen“ selbst kontrollieren.</p>' : ''}

}

/* ================= Meldungen ================= */
function updateStatus() {
  const msgs = [];
  if (App.mode === 'digital') {
    if (D.conflict) msgs.push(['err', 'Konflikt: Zwei Ausgänge sind direkt miteinander verbunden und liefern verschiedene Werte (Kurzschluss).']);
    if (App.settings.slow) msgs.push(['', 'Zeitlupe: Jedes Gatter braucht 0,3 s (Gatterlaufzeit).']);
    else if (D.stable === false && !circ().comps.some(c => c.type === 'clock')) msgs.push(['', 'Die Schaltung kommt nicht zur Ruhe (Schwingung durch Rückkopplung).']);
  } else {
    for (const c of circ().comps) {
      if (c.type === 'battery' && Math.abs(c.st.I || 0) > 3) { msgs.push(['err', `Kurzschluss an ${c.label ? esc(c.label) : 'der Spannungsquelle'}! (I = ${fmtSI(Math.abs(c.st.I), 'A')})`]); break; }
    }
    for (const c of circ().comps) if (c.st.broken) { msgs.push(['err', `${DEFS[c.type].name} ${esc(c.label)} ist durchgebrannt. Antippen → „Reparieren“.`]); break; }
    if (!A.ok) msgs.push(['', 'Die Berechnung konvergiert gerade nicht – Werte können ungenau sein.']);
  }
  if (!App.running) msgs.push(['', 'Simulation angehalten.']);
  if (!UI.dgT || performance.now() - UI.dgT > 400) { UI.dgT = performance.now(); UI.dg = diagnose(); }
  (UI.dg || []).slice(0, 2).forEach(m => msgs.push(['info', 'Hinweis: ' + m]));
  const k = JSON.stringify(msgs); if (k === UI.msgKey) return; UI.msgKey = k;
  $('#status').innerHTML = msgs.map(m => `<div class="msg ${m[0]}">${m[1]}</div>`).join('');
}

/* ================= Hauptschleife ================= */
let lastT = performance.now();
let AT = 0; // Animations-Uhr (ms): laeuft nur, solange die Simulation laeuft – Strom-, Summer- und Motor-Animation bleiben bei Pause stehen
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  if (App.running && (App.mode === 'digital' || App.mode === 'analog')) AT += dt * 1000;
  try {
    if (App.mode === 'pn') { soundUpdate(false); pnFrame(dt); }
    else if (App.mode === 'cpu') { soundUpdate(false); cpuFrame(dt); }
    else {
      if (App.mode === 'digital') dFrame(dt); else aFrame(dt);
      if (App.mode === 'analog' && App.running) {
        const sgn = App.settings.flow === 'conv' ? 1 : -1;
        for (const w of circ().wires) if (w.cur) { const a = Math.abs(w.cur); const sp = 14 * clamp(Math.log10(a / 1e-6), 0, 6.5); w.ph = (w.ph || 0) + Math.sign(w.cur) * sgn * sp * dt; }
      }
      soundUpdate(App.mode === 'analog' && App.running && circ().comps.some(c => c.type === 'buzzer' && Math.abs(c.st.pinI ? c.st.pinI[0] : 0) > 0.005));
      drawScene(ctx); updateMeas(false); updateStatus(); recDraw(); gateBtns();
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

/* ---------------- „+ Eingang“ direkt am ausgewählten Gatter ---------------- */
function gateBtns() {
  const el = $('#gateBtns'); if (!el) return;
  const s = App.sel, c = s && s.kind === 'comp' && App.mode === 'digital' ? findComp(s.id) : null;
  const ok = c && GT[c.type] && !GT[c.type].one && !(App.task && App.task.lockTools);
  if (!ok) { if (!el.hidden) el.hidden = true; return; }
  const v = view(), d = DEFS[c.type], b = d.box(c);
  const pts = [[b[0], b[1]], [b[2], b[1]], [b[0], b[3]], [b[2], b[3]]].map(([x, y]) => xf(c, x, y));
  const cx = (Math.min(...pts.map(p => p.x)) + Math.max(...pts.map(p => p.x))) / 2, by = Math.max(...pts.map(p => p.y));
  const n = gN(c), key = c.id + ':' + n;
  if (el.dataset.k !== key) {
    el.dataset.k = key;
    el.innerHTML = (n > 2 ? `<button data-d="-1" title="Einen Eingang entfernen">−</button>` : '') + (n < 4 ? `<button data-d="1" title="Einen Eingang hinzufügen (bis zu 4)">＋ Eingang</button>` : '') + `<span>${n} Eingänge</span>`;
    el.querySelectorAll('button').forEach(bt => bt.onclick = e => {
      e.stopPropagation(); const cc = findComp(App.sel && App.sel.id); if (!cc) return;
      const m = clamp(gN(cc) + +bt.dataset.d, 2, 4); if (m === gN(cc)) return;
      pushUndo(); cc.props.n = m; changed();
    });
    el.onpointerdown = e => e.stopPropagation();
  }
  el.style.left = (cx * G * v.z + v.x) + 'px'; el.style.top = (by * G * v.z + v.y + 8) + 'px';
  if (el.hidden) el.hidden = false;
}
/* ================= Eigene Bausteine (Module) ================= */
const posSort = (a, b) => a.y - b.y || a.x - b.x;
function circIO(cc) {
  return {
    ins: cc.comps.filter(c => c.type === 'switch' || c.type === 'button').sort(posSort),
    outs: cc.comps.filter(c => c.type === 'led').sort(posSort),
  };
}
function newModId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
/* benutzt die Schaltung (direkt oder verschachtelt) den Baustein mid? */
function circUses(cs, mid, seen = new Set()) {
  for (const c of cs.comps || []) if (c.type === 'mod') {
    if (c.props.mid === mid) return true;
    if (seen.has(c.props.mid)) continue; seen.add(c.props.mid);
    const M = App.modules.find(m => m.id === c.props.mid);
    if (M && circUses(M.circuit, mid, seen)) return true;
  }
  return false;
}
function modUseCount(mid) {
  let n = 0;
  const cs = [baseCirc('digital'), ...App.modules.filter(m => m.id !== mid).map(m => m.circuit)];
  for (const c of cs) for (const q of c.comps || []) if (q.type === 'mod' && q.props && q.props.mid === mid) n++;
  return n;
}
function refreshModules() {
  for (const c of App.circ.digital.comps) if (c.type === 'mod') { c.st.sub = null; c.st.ver = -1; }
  App.netDirty = true; if (App.mode === 'digital') buildPalette(); scheduleSave();
}

/* ================= Innerer Aufbau (Doppelklick / langes Tippen) ================= */
/* Hilfen für Transistorschaltungen: Versorgung, Eingänge mit Pull-down, Ausgang mit LED */
function cmosFrame(b, inputs, rails) {
  const [yT, yB, xT, xR] = rails;
  b.add('battery', 2, Math.round((yT + yB) / 2), { r: 3, p: { U: 5 }, l: 'UB' });
  const ym = Math.round((yT + yB) / 2);
  b.w(2, ym - 2, 2, yT, xT, yT); b.w(2, ym + 2, 2, yB, xR, yB);
  inputs.forEach(([x, l, on]) => {
    b.add('aswitch', x, yT + 5, { r: 1, l, p: { on } });
    b.add('resistor', x, yB - 6, { r: 1, p: { R: 100000 }, l: 'R' + l });
    b.w(x, yT, x, yT + 3); b.w(x, yT + 7, x, yB - 8); b.w(x, yB - 4, x, yB);
  });
}
function cmosOut(b, x, y, yB) {
  // Ausgang bei (x,y): Vorwiderstand, LED, Spannungsmesser
  b.add('resistor', x + 4, y, { p: { R: 330 }, l: 'RV' });
  b.add('aled', x + 6, y + 4, { r: 1, l: 'Y' });
  b.add('voltmeter', x + 10, y + 4, { r: 1, l: 'UY' });
  b.w(x, y, x + 2, y); b.w(x + 6, y, x + 6, y + 2); b.w(x + 6, y + 6, x + 6, yB);
  b.w(x + 1, y, x + 1, y - 2, x + 10, y - 2, x + 10, y + 2); b.w(x + 10, y + 6, x + 10, yB);
}

  let ins = [];

    const N = App.net.compNodes.get(c.id);
    DEFS[c.type].pins(c).forEach((p, i) => { if (p.dir === 'in') ins.push(N && D.nv[N[i]] === 1 ? 1 : 0); });
  }
  while (ins.length < 3) ins.push(0);
  const t = I.mode;
  App.inner.push({ target: t, prevMode: App.mode, backup: JSON.stringify(serialize(App.circ[t])), hist: App.hist[t], view: { ...App.view[t] }, title: I.title, text: I.text, n: c.type in GT && gN(c) > 2 ? gN(c) : 0 });
  const cc = { comps: [], wires: [] };
  I.build(mkB(cc), ins);
  App.circ[t] = cc; App.hist[t] = { u: [], r: [] };
  App.sel = null;
  if (App.mode !== t) setMode(t); else changed();

  requestAnimationFrame(() => { fitView(); });
  showInnerBar();
}
function closeInner() {
  const E = App.inner.pop(); if (!E) return;
  App.circ[E.target] = deserialize(JSON.parse(E.backup)); App.hist[E.target] = E.hist; App.view[E.target] = E.view;
  App.sel = null;
  if (App.mode !== E.prevMode) setMode(E.prevMode); else changed();
  App.netDirty = true; App.aDirty = true;
  showInnerBar();
}

  SW: ['Steuerwerk', 'Control Unit', 'Das „Gehirn“ des Prozessors. Es liest den Opcode aus dem IR und führt Takt für Takt das passende Mikroprogramm aus. In jedem Takt erzeugt es die Steuersignale: Es öffnet Tore zum Bus, wählt die ALU-Operation, löst RD oder WR aus und erhöht PC oder SP. Jeder Befehl beginnt mit derselben Holphase.'],
  MP: ['Mikroprogramm', 'Folge von Steuerworten', 'Zeigt die Mikroschritte des aktuellen Befehls (bzw. der Holphase). Jede Zeile ist ein Takt: welche Quelle auf den Bus darf, welche Register übernehmen, ob gelesen oder geschrieben wird. Der markierte Schritt ist der nächste. Die Mikroprogramme lassen sich im Reiter „Befehlssatz“ ansehen und selbst bauen.'],

  RAM: ['RAM', 'Random Access Memory – Arbeitsspeicher', '256 Speicherzellen zu je 8 Bit mit den Adressen $00 bis $FF. Nach dem <b>Von-Neumann-Prinzip</b> liegen Programm und Daten im selben Speicher – ob ein Byte ein Befehl oder eine Zahl ist, entscheidet allein, wie der Prozessor darauf zugreift. „Random Access“ heißt: Jede Zelle ist gleich schnell erreichbar.<br><br><b>Tipp:</b> Einen Wert in der Liste antippen, um ihn zu ändern (hexadezimal, z. B. 3F). Mit ↑/↓ geht es zur nächsten Zelle.'],
  IBUS: ['Interner Datenbus', '8 parallele Leitungen im Prozessor', 'Verbindet alle Register, die ALU und die Ein-/Ausgabe. In jedem Takt darf genau <b>eine</b> Quelle ihren Wert auf den Bus legen (sonst gäbe es einen Kurzschluss); beliebig viele Register können ihn gleichzeitig übernehmen. Jede Leitung überträgt ein Bit: rot = 1, blau = 0.'],

  GATE: ['Tor', 'Busschalter (Tri-State-Treiber)', 'Jedes Register ist über ein Tor mit dem Bus verbunden. Nur wenn das Steuerwerk das Tor öffnet, fließt ein Wert: <span style="color:#e67700">orange</span> = das Register schreibt auf den Bus, <span style="color:#2b8a3e">grün</span> = das Register übernimmt den Buswert. Geschlossene Tore trennen das Register vom Bus.'],
  CPU: ['CPU', 'Central Processing Unit – Prozessor', 'Der Prozessor besteht aus Steuerwerk und Rechenwerk sowie den Registern. Er arbeitet nach dem Von-Neumann-Zyklus: Befehl holen, decodieren, ausführen – immer wieder.'],

function cpuHit(x, y) {
  if (isBasic()) return cpuHitBasic(x, y);
  for (const [k, [bx, by]] of Object.entries(BOX)) if (x >= bx && x <= bx + RW && y >= by && y <= by + RH) return k;
  for (let i = 0; i < 3; i++) { const fx = 70 + i * 60; if (x >= fx && x <= fx + 46 && y >= 466 && y <= 488) return ['N', 'Z', 'C'][i]; }
  if (x >= 135 && x <= 171 && y >= 437 && y <= 458) return 'Z';
  if (x >= 80 && x <= 255 && y >= 384 && y <= 424) return 'ALU';
  const gates = [...['PC', 'SP', 'IR', 'MAR'].map(k => [BOX[k][0] + RW / 2, (BOX[k][1] + RH + BUSY - IBH) / 2]), ...['A', 'B', 'DR', 'IN', 'OUT'].map(k => [BOX[k][0] + RW / 2, (BUSY + IBH + BOX[k][1]) / 2]), [292, 366]];
  for (const [gx, gy] of gates) if (Math.abs(x - gx) <= 18 && Math.abs(y - gy) <= 8) return 'GATE';
  if (x >= 432 && x <= 552 && y >= BUSY - IBH - 33 && y <= BUSY - IBH - 3) return 'IBUS';
  if (x >= 26 && x <= 690 && Math.abs(y - BUSY) <= IBH + 2) return 'IBUS';
  if (x >= 650 && x <= 762 && Math.abs(y - (BOX.MAR[1] + RH / 2)) <= 28) return 'ABUS';
  if (x >= 650 && x <= 762 && Math.abs(y - (BOX.DR[1] + RH / 2)) <= 28) return 'DBUS';
  if (x >= 540 && x <= 762 && y >= 40 && y <= 72) return 'CBUS';
  if (x >= 36 && x <= 290 && y >= 50 && y <= 166) return 'MP';
  if (x >= 300 && x <= 540 && y >= 34 && y <= SW_B) return 'SW';
  if (x >= 760 && x <= 990 && y >= 20 && y <= 46) return 'RAM';
  if (x >= 36 && x <= 286 && y >= RW_Y && y <= 490) return 'RW';
  if (x >= 300 && x <= 740 && y >= 515 && y <= 620) return 'IO';
  if (x >= 20 && x <= 700 && y >= 20 && y <= 500) return 'CPU';
  return null;
}

function cpuHelp() {
  return `<div class="help"><h4>So arbeitet der Rechner</h4><p>Jeder Befehl wird in zwei Phasen abgearbeitet: In der <b>Holphase</b> wird das Befehlsbyte, auf das der Befehlszähler PC zeigt, über den Adress- und Datenbus aus dem RAM ins Befehlsregister IR geholt. In der <b>Ausführungsphase</b> öffnet das Steuerwerk nacheinander die Tore, die im <b>Mikroprogramm</b> des Befehls festgelegt sind.</p>
  <p>In jedem Mikroschritt darf <b>genau eine Quelle</b> ihren Wert auf den internen Bus legen; beliebig viele Register können ihn übernehmen. RD und WR steuern über den Steuerbus den Speicher: Lesen holt RAM[MAR] ins Datenregister DR, Schreiben legt DR in RAM[MAR] ab.</p>
  <h4>Erklärungen</h4><p>Tippe im Schaubild auf ein Bauteil, einen Bus, ein Tor oder ein Flag – dann erscheint, wofür die Abkürzung steht und was das Bauteil tut. Ein <b>Doppelklick</b> (oder langes Tippen) öffnet den <b>inneren Aufbau aus Logikgattern</b> im Reiter „Logikgatter“ – dort kannst du ihn mit Schaltern ausprobieren. „← Zurück“ bringt dich wieder zum Rechner.</p>
  <h4>Busleitungen</h4><p>Jeder Bus besteht aus 8 einzelnen Leitungen – eine pro Bit (Bit 7 oben, Bit 0 unten). <b style="color:#e5383b">Rot</b> = 1, <b style="color:#3d5a99">Blau</b> = 0, <b style="color:#98a2b3">Grau</b> = in diesem Takt legt niemand einen Wert auf den Bus. Liegt z. B. $A9 auf dem Bus, führen die Leitungen 7, 5, 3 und 0 eine 1 (1010 1001). Der Steuerbus hat die Leitungen RD und WR.</p>
  <h4>Farben</h4><p><b style="color:#e67700">Orange</b>: Quelle, die gerade auf den Bus schreibt. <b style="color:#2b8a3e">Grün</b>: Register, die den Buswert übernehmen. Die kleinen Quadrate sind die <b>Tore</b>.</p>
  <h4>Steuerung</h4><ul><li><b>Schritt</b> (Leertaste): genau ein Takt des Steuerwerks, dann wartet der Rechner.</li><li><b>Befehl</b> (Eingabetaste): bis zum Ende des aktuellen Befehls.</li><li><b>Start</b>: fortlaufend mit dem eingestellten Takt.</li><li><b>Reset</b>: Register auf 0, PC = 0. Der Speicher bleibt erhalten.</li></ul>
  <h4>Flags</h4><p><b>Z</b> (Zero): Ergebnis war 0. <b>C</b> (Carry): Übertrag bzw. „Borgen“ bei der Subtraktion. <b>N</b> (Negativ): höchstes Bit des Ergebnisses ist 1 (Zweierkomplement).</p>
  <h4>Stapel</h4><p>SP startet bei $00; PUSH und CALL verringern ihn zuerst, der Stapel wächst also von $FF abwärts.</p>
  <h4>Eigene Befehle</h4><p>Im Reiter <b>Befehlssatz</b> lässt sich jeder Befehl als Folge von Mikroschritten selbst bauen. „Prüfen“ deckt typische Fehler auf (Bus ohne Quelle, Lesen und Schreiben gleichzeitig, Operand nicht übersprungen …). Mit dem Schloss werden fertige Befehle gegen versehentliches Ändern <b>abgesichert</b>.</p>
  <h4>Pseudocode (Hochsprache)</h4><p>Im Reiter <b>Pseudocode</b> schreibt man Programme mit englischen Befehlen (<code>IF</code>, <code>WHILE</code>, <code>FOR</code>, <code>REPEAT</code>, <code>PROCEDURE</code>, <code>ARRAY</code> …). Der Compiler übersetzt sie in Assembler und lädt den Hexcode in den RAM. Die <b>Zuordnung</b> zeigt, welche Maschinenbefehle zu welcher Zeile gehören – beim schrittweisen Ausführen wird die aktuelle Zeile markiert. <b>Tokens</b> und <b>Syntaxbaum</b> zeigen die Phasen des Compilers; im <b>Compiler-Labor</b> sieht man Schritt für Schritt zu, wie der Lexer (mit endlichem Automaten), der Parser (Grammatik, Aufrufstapel, wachsender Baum) und die Codeerzeugung arbeiten – im <b>Vorhersage-Modus</b> raten die Schüler vorher den nächsten Schritt. <b>Laufzeit</b> vergleicht den Code mit und ohne Optimierung. <code>*</code>, <code>DIV</code> und <code>MOD</code> werden zu Unterprogrammen, Feldzugriffe mit variablem Index zu selbstveränderndem Code.</p>
  <h4>Assembler</h4><p><b>MikroSim:</b> Mit „Öffnen“ lassen sich MikroSim-Dateien laden – Mikroprogramm (<code>.mpd</code>), Programm als Assemblerliste (<code>.ras</code>) oder RAM-Tabelle (<code>.rad</code>). Dann gilt die MikroSim-Schreibweise (<code>mov AX, [80]</code>, Zahlen hexadezimal).</p><p>Zahlen dezimal (<code>42</code>), hexadezimal (<code>$2A</code>, <code>2Ah</code>, <code>0x2A</code>), binär (<code>%00101010</code>) oder als Zeichen (<code>'A'</code>). Marken enden mit Doppelpunkt; Rechnen mit Marken ist möglich (<code>lese+1</code>). <code>DB</code> legt Datenbytes ab, <code>ORG</code> setzt die Adresse, <code>;</code> leitet Kommentare ein.</p>${aboutHTML()}</div>`;
}

function cpuHelpBasic() {
  return `<div class="help"><h4>So arbeitet der Rechner</h4><p>Programm und Daten stehen als Zahlen im <b>Speicher</b> (RAM). Der Prozessor arbeitet das Programm Befehl für Befehl ab – immer in zwei Schritten:</p>
  <ol><li><b>① Befehl holen:</b> Der <b>Befehlszähler</b> sagt, an welcher Adresse der nächste Befehl steht. Der Befehl wird über den Bus ins Steuerwerk geholt, der Befehlszähler zählt weiter.</li><li><b>② Befehl ausführen:</b> Das Steuerwerk führt den Befehl aus – es holt z. B. eine Zahl aus dem Speicher, lässt das Rechenwerk rechnen oder gibt den Akku aus.</li></ol>

/* ---------- Baumzeichnung ---------- */
function labTreeSVG(roots, progRoot, clsFn) {
  const NH = 26, VG = 52, HG = 12, pos = new Map(); let cx = 0, maxD = 0;

  const lay = (n, d) => {
    maxD = Math.max(maxD, d); const ks = nodeKids(n);
    if (!ks.length) { const x = cx + w(n) / 2; cx += w(n) + HG; pos.set(n, [x, d]); return x; }
    const xs = ks.map(k => lay(k, d + 1)); let x = (xs[0] + xs[xs.length - 1]) / 2;
    pos.set(n, [x, d]); return x;
  };
  roots.forEach(r => { lay(r, 0); cx += 26; });
  const W = Math.max(cx, 100), H = (maxD + 1) * VG + 10;
  let h = `<svg viewBox="-6 -6 ${W + 12} ${H + 6}" style="width:${Math.min(W + 12, 2000)}px;max-width:100%" class="tree">`;
  const edges = (n) => { const [x, d] = pos.get(n); nodeKids(n).forEach(k => { const [x2, d2] = pos.get(k); h += `<path d="M${x} ${d * VG + NH}L${x2} ${d2 * VG}" class="te"/>`; edges(k); }); };
  roots.forEach(edges);
  for (const [n, [x, d]] of pos) {
    const ww = w(n), c = clsFn(n);
    h += `<g class="tn ${nodeKind(n)} ${c}"><rect x="${x - ww / 2}" y="${d * VG}" width="${ww}" height="${NH}" rx="7"/><text x="${x}" y="${d * VG + 17.5}">${esc(nodeLabel(n, progRoot))}</text></g>`;
  }
  return h + '</svg>';
}

      const outI = pads.reduce((b, pd, i) => pd.pos[0] > pads[b].pos[0] ? i : b, 0);
      const ins = pads.map((pd, i) => i).filter(i => i !== outI).sort((a, b) => pads[a].pos[1] - pads[b].pos[1]);
      const n = clamp(ins.length, 1, 4);
      if (!['not', 'buf'].includes(type)) props.n = clamp(n, 2, 4);
      order = [...ins.slice(0, n), outI];
      drivers.add(find(pid + '.' + pads[outI].id));
    } else order = m.gate ? order : m.pins.map((k, i) => k >= 0 ? k : (m.pins.length > 2 ? -1 : i));
    if (m.unused) for (const u of m.unused) { const k = 'terminal-' + u, used = links.some(L => L.a === pid + '.' + k || L.b === pid + '.' + k); if (used) report.notes.add(`Die Eingänge ${m.unused.join('/')} von ${nm} (Setzen/Rücksetzen) werden in LOGHEX nicht nachgebildet.`); }
    const D = DEFS[type]; if (!D) { count(report.unknown, nm); mark(nm); continue; }
    const c = { id: id(), type, x: 0, y: 0, rot: 0, mir: false, props: Object.assign({}, D.defaults ? JSON.parse(JSON.stringify(D.defaults)) : {}, props) };
    for (const p of D.props || []) if (c.props[p.key] == null) c.props[p.key] = p.def;
    const lp = D.pins(c);
    const targ = order.map(k => W[k]).filter(Boolean);
    let best = null; const mx = Math.round(targ.reduce((s, t) => s + t[0], 0) / Math.max(1, targ.length)), my = Math.round(targ.reduce((s, t) => s + t[1], 0) / Math.max(1, targ.length));
    for (let rot = 0; rot < 4; rot++) for (const mir of [false, true]) for (let dx = -3; dx <= 3; dx++) for (let dy = -3; dy <= 3; dy++) {
      const t = { x: mx + dx, y: my + dy, rot, mir };
      let cost = 0;
      order.forEach((k, i) => {
        if (!W[k] || !lp[i]) return;
        const q = xf(t, lp[i].x, lp[i].y), ex = W[k][0] - q.x, ey = W[k][1] - q.y; cost += Math.abs(ex) + Math.abs(ey) + (ex && ey ? 6 : 0);
        // Anschluss darf nicht auf einem fremden Leitungs- oder Anschlusspunkt liegen (sonst ungewollte Verbindung)
        if ((ex || ey) && occ.has(q.x + ',' + q.y)) cost += 200;
        // Verlängerungen sollen vom Bauteil weg nach außen zeigen, nicht zurück über das Bauteil
        const r = ixf(t, W[k][0], W[k][1]), px = lp[i].x, py = lp[i].y, sx = r.x - px, sy = r.y - py;
        if ((Math.abs(px) >= Math.abs(py) ? sx * Math.sign(px) : sy * Math.sign(py)) < 0) cost += 25;
      });
      cost += (Math.abs(dx) + Math.abs(dy)) * 0.01 + (mir ? 0.05 : 0);
      if (!best || cost < best.cost) best = { cost, ...t };
    }
    Object.assign(c, { x: best.x, y: best.y, rot: best.rot, mir: best.mir });
    comps.push(c);
    const stubs = [];
    order.forEach((k, i) => {
      if (!W[k] || !lp[i]) return;
      const q = xf(c, lp[i].x, lp[i].y), ex = q.x - c.x, ey = q.y - c.y;
      stubs.push({ a: [q.x, q.y], w: W[k], side: Math.abs(ex) >= Math.abs(ey) ? [Math.sign(ex) || 1, 0] : [0, Math.sign(ey) || 1] });
      if (lp[i].dir === 'out' && pads[k]) drivers.add(find(pid + '.' + pads[k].id));
    });
    ykRoute(stubs, addWire, occ); stubs.forEach(st => occ.add(st.a.join(',')));
    count(report.ok, D.name);
  }
  // --- Leitungen: Verlauf übernehmen, Anfang und Ende genau an die Anschlüsse legen ---
  let nl = 0;
  for (const L of links) {
    const a = padW.get(L.a), b = padW.get(L.b);
    let pts = L.pts.map(P);
    if (a) pts[0] = a; if (!pts.length && a) pts = [a];
    if (b) { if (pts.length < 2) pts.push(b); else pts[pts.length - 1] = b; }
    for (let i = 1; i < pts.length; i++) addWire(pts[i - 1], pts[i]);
    if (pts.length > 1) nl++;
  }
  report.links += nl;
  // --- T-Abzweige: Leitungen an Endpunkten anderer Leitungen auftrennen, damit sie verbunden sind ---
  const ends = new Set(); for (const L of links) for (const k of [L.a, L.b]) if (linkPads.has(k) && padW.get(k)) ends.add(padW.get(k).join(','));
  const out = [];
  for (const w of wires) {
    const cut = [];
    for (const k of ends) { const [x, y] = k.split(',').map(Number);
      if (w.x1 === w.x2 && x === w.x1 && y > Math.min(w.y1, w.y2) && y < Math.max(w.y1, w.y2)) cut.push([x, y]);
      else if (w.y1 === w.y2 && y === w.y1 && x > Math.min(w.x1, w.x2) && x < Math.max(w.x1, w.x2)) cut.push([x, y]); }
    if (!cut.length) { out.push(w); continue; }
    const pts = [[w.x1, w.y1], ...cut.sort((p, q) => (p[0] - w.x1) ** 2 + (p[1] - w.y1) ** 2 - (q[0] - w.x1) ** 2 - (q[1] - w.y1) ** 2), [w.x2, w.y2]];
    for (let i = 1; i < pts.length; i++) out.push({ id: id(), x1: pts[i - 1][0], y1: pts[i - 1][1], x2: pts[i][0], y2: pts[i][1] });
  }
  // --- ins positive Koordinatenfeld schieben ---
  const xs = [...comps.map(c => c.x), ...out.flatMap(w => [w.x1, w.x2])], ys = [...comps.map(c => c.y), ...out.flatMap(w => [w.y1, w.y2])];
  const ox = xs.length ? 4 - Math.min(...xs) : 0, oy = ys.length ? 4 - Math.min(...ys) : 0;
  comps.forEach(c => { c.x += ox; c.y += oy; }); out.forEach(w => { w.x1 += ox; w.x2 += ox; w.y1 += oy; w.y2 += oy; });
  const shift = ([x, y]) => [x + ox, y + oy];
  return { comps, wires: out, padW, shift, drivers, find };
}

/* Yenka-Block → eigener Baustein (Inhalt wird zur inneren Schaltung, Anschlüsse werden Schalter/LEDs) */
function ykBlock(o, S0, ctx, depth, comps, addWire, id, padW, drivers, find, occ) {
  const sp = ykKids(o.e, 'space')[0]; if (!sp) return;
  const title = (ykProp(o.e, 'title') || 'Block').slice(0, 28);
  const inner = ykSpace(sp, ctx, depth + 1);
  // Richtung jedes Anschlusses: Wird der innere Knoten von einem Gatter-/Blockausgang getrieben, ist es ein Ausgang.
  const pins = o.refl.map(r => {
    const w = inner.padW.get(r.owner); if (!w) return null;
    const out = inner.drivers.has(inner.find(r.owner));
    const a = parseFloat(ykProp([...o.e.children].find(x => x.tagName === 'reflection' && x.getAttribute('id') === r.id), 'orientation')) || 0;
    return { r, w: inner.shift(w), out, ov: [Math.round(Math.cos(a)), Math.round(Math.sin(a))] };
  }).filter(Boolean);
  // Schalter (Eingänge) bzw. LEDs (Ausgänge) im Inneren, nach außen weisend an den Knoten gesetzt
  const ROT = { '1,0': 0, '0,1': 1, '-1,0': 2, '0,-1': 3 };
  for (const p of pins) {
    const v = p.ov[0] || p.ov[1] ? p.ov : [p.out ? 1 : -1, 0];
    // Schalter: Anschluss lokal (2,0) zeigt nach innen (−v); LED: Anschluss lokal (−2,0) zeigt nach innen
    const rot = p.out ? ROT[v.join(',')] : ROT[[-v[0], -v[1]].join(',')];
    const c = { id: 1e6 + inner.comps.length, type: p.out ? 'led' : 'switch', x: p.w[0] + 2 * v[0], y: p.w[1] + 2 * v[1], rot: rot | 0, mir: false, props: p.out ? { color: 'red' } : { on: 0 } };
    inner.comps.push(c); p.comp = c;
  }
  const posSort = (a, b) => a.comp.y - b.comp.y || a.comp.x - b.comp.x;
  const ins = pins.filter(p => !p.out).sort(posSort), outs = pins.filter(p => p.out).sort(posSort);
  // gleiche Blöcke nur einmal als Baustein anlegen
  const circuit = { comps: inner.comps, wires: inner.wires };
  const sig = title + '|' + ins.length + '|' + outs.length + '|' + inner.comps.map(c => c.type + c.x + ',' + c.y).sort().join(';');
  let M = ctx.modules.find(m => m._sig === sig);
  if (!M) {
    M = { id: 'yk' + Date.now().toString(36) + ctx.modules.length, name: title, sym: title.slice(0, 8), circuit, ins: ins.map((_, i) => 'E' + (i + 1)), outs: outs.map((_, i) => 'A' + (i + 1)), ver: 1, _sig: sig };
    ctx.modules.push(M); ctx.report.blocks++;
  }
  // Instanz: Anschlussreihen wie in modLayout
  const n = ins.length, m = outs.length, H = Math.max(n, m, 1), top = -Math.floor((H - 1) / 2), oi = Math.floor((H - n) / 2), oo = Math.floor((H - m) / 2);
  const inst = { id: id(), type: 'mod', x: S0[0], y: S0[1], rot: 0, mir: false, props: { mid: M.id } };
  comps.push(inst);
  // Verdrahtung Anschluss → Yenka-Anschlusspunkt: waagerecht hinaus, senkrecht (jede Leitung in eigener Spalte), waagerecht hin.
  // So laufen keine zwei Leitungen übereinander.
  const items = [];
  ins.forEach((p, i) => { const w = padW.get(p.r.id); if (w) items.push({ a: [inst.x - 3, inst.y + top + oi + i], w, side: [-1, 0] }); });
  outs.forEach((p, i) => { const w = padW.get(p.r.id); if (w) items.push({ a: [inst.x + 3, inst.y + top + oo + i], w, side: [1, 0] }); });
  ykRoute(items, addWire, occ);
  outs.forEach(p => drivers.add(find(p.r.id)));
  ctx.report.ok['Block „' + title + '“'] = (ctx.report.ok['Block „' + title + '“'] || 0) + 1;
}

/* Verlängerungen von Bauteilanschlüssen zu den Yenka-Anschlusspunkten verlegen.
   items: { a: Anschluss in LOGHEX, w: Yenka-Punkt, side: [dx, dy] nach außen }.
   Gerade Verbindungen bleiben gerade; sonst: hinaus in eine eigene Spalte (bzw. Zeile), quer, hinein.
   Jede Leitung bekommt eine eigene Spalte, die auf keinem Zielpunkt liegt – so berühren sich zwei Verlängerungen nie. */
function ykRoute(items, addWire, occ) {
  const groups = new Map();
  for (const it of items) {
    const [dx, dy] = it.side, hz = dx !== 0;
    if (hz ? it.a[1] === it.w[1] && Math.sign(it.w[0] - it.a[0]) !== -dx : it.a[0] === it.w[0] && Math.sign(it.w[1] - it.a[1]) !== -dy) { addWire(it.a, it.w); continue; }
    const k = it.side.join(','); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it);
  }
  for (const [k, list] of groups) {
    const [dx, dy] = k.split(',').map(Number), hz = dx !== 0, s = hz ? dx : dy;
    const A = it => hz ? it.a[1] : it.a[0], Wq = it => hz ? it.w[1] : it.w[0];       // Koordinate entlang der Seite
    const out = it => hz ? it.a[0] : it.a[1];                                          // Lage der Anschlussreihe
    // Reihenfolge, die Kreuzungen klein hält: wer „nach hinten“ wandert, bekommt die inneren Spalten
    const fwd = list.filter(it => Wq(it) > A(it)).sort((p, q) => A(q) - A(p)), back = list.filter(it => Wq(it) <= A(it)).sort((p, q) => A(p) - A(q));
    const used = new Set(), bad = new Set(list.map(it => hz ? it.w[0] : it.w[1]));
    let step = 1;
    for (const it of [...fwd, ...back]) {
      // Eckpunkte dürfen nicht auf vorhandenen Leitungsenden/Anschlüssen liegen (sonst entstünde eine Verbindung)
      const corner = m => hz ? [[m, it.a[1]], [m, it.w[1]]] : [[it.a[0], m], [it.w[0], m]];
      let m; do { m = out(it) + s * step++; } while (bad.has(m) || used.has(m) || (occ && corner(m).some(p => occ.has(p.join(',')))));
      if (occ) corner(m).forEach(p => occ.add(p.join(',')));
      used.add(m);
      if (hz) { addWire(it.a, [m, it.a[1]]); addWire([m, it.a[1]], [m, it.w[1]]); addWire([m, it.w[1]], it.w); }
      else { addWire(it.a, [it.a[0], m]); addWire([it.a[0], m], [it.w[0], m]); addWire([it.w[0], m], it.w); }
    }
  }
}

/* Hauptfunktion: liefert { mode, circuit, modules, report } */
function ykConvert(xml) {
  // Yenka nutzt keine DTD; Dateien mit DOCTYPE/ENTITY werden abgelehnt (Schutz vor Entity-Expansion)
  if (/<!DOCTYPE|<!ENTITY/i.test(xml)) throw new Error('Die Datei enthält unerlaubte XML-Anweisungen.');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Die Yenka-Datei ist beschädigt (XML fehlerhaft).');
  // erste Szene mit Inhalt
  const scenes = [...doc.getElementsByTagName('scene')];
  const scene = scenes.find(s => ykKids(s, 'part').some(p => p.getAttribute('class'))) || scenes[0];
  if (!scene) throw new Error('Die Yenka-Datei enthält keine Schaltung.');
  // Betriebsart: sobald irgendwo (auch in Blöcken) ein Logikbaustein vorkommt, wird es eine Logikschaltung
  const all = [...doc.getElementsByTagName('part')].filter(p => p.getAttribute('class'));
  const mode = all.some(p => { const m = ykMap(p.getAttribute('class'), []); return m && m.mode === 'digital'; }) ? 'digital' : 'analog';
  const ctx = { mode, scale: mode === 'digital' ? 8 : YK_SCALE, modules: [], report: { ok: {}, unknown: {}, skip: {}, notes: new Set(), texts: 0, links: 0, blocks: 0 } };
  const r = ykSpace(scene, ctx, 0);
  if (!r.comps.length) throw new Error('In der Yenka-Datei wurden keine Bauteile gefunden.');
  return { mode, circuit: { comps: r.comps, wires: r.wires }, modules: ctx.modules.map(({ _sig, ...m }) => m), report: ctx.report };
}

async function ykImport(file) {
  const xml = await ykUnzip(await file.arrayBuffer(), 'model.xml');
  const r = ykConvert(xml);
  loadData({ mode: r.mode, circuit: r.circuit, modules: r.modules });
  const li = o => Object.entries(o).map(([k, n]) => `<li>${n} × ${esc(k)}</li>`).join('');
  const unk = Object.keys(r.report.unknown).length;
  openModal('Yenka-Datei importiert', `<p>„${esc(file.name)}“ wurde in den Reiter <b>${r.mode === 'digital' ? 'Logikgatter' : 'Elektronik &amp; Halbleiter'}</b> übernommen.</p>
    <ul style="margin:6px 0 10px;padding-left:20px;font-size:13.5px">${li(r.report.ok)}${r.report.links ? `<li>${r.report.links} Leitungen</li>` : ''}${r.report.texts ? `<li>${r.report.texts} Beschriftung(en)</li>` : ''}</ul>
    ${r.report.blocks ? `<p style="font-size:13.5px">Yenka-Blöcke wurden zu <b>${r.report.blocks} eigenen Baustein(en)</b>. Ihr Inhalt lässt sich per Doppelklick ansehen; die Anschlüsse heißen E1, E2 … (Eingänge) und A1, A2 … (Ausgänge).</p>` : ''}
    ${Object.keys(r.report.skip).length ? `<p style="color:#667085;font-size:13px">Ohne Funktion in einer Logikschaltung und daher weggelassen: ${Object.entries(r.report.skip).map(([k, n]) => n + ' × ' + esc(k)).join(', ')}.</p>` : ''}
    ${[...r.report.notes].map(t => `<p style="color:#b35c00;font-size:13px">${esc(t)}</p>`).join('')}
    ${unk ? `<p style="color:#c92a2a;font-size:13.5px"><b>Nicht übernommen</b> (als „?“ markiert):</p><ul style="margin:0 0 10px;padding-left:20px;font-size:13.5px;color:#c92a2a">${li(r.report.unknown)}</ul>` : ''}
    <p style="color:#667085;font-size:13px">Die Bauteile sind in LOGHEX kleiner als in Yenka; ihre Anschlüsse wurden deshalb mit kurzen Leitungsstücken verlängert. Schalter stehen anfangs auf „aus“. Mit „Speichern“ lässt sich die Schaltung als LOGHEX-Datei sichern.</p>`);
}
/* ================= MikroSim-Programme im Rechner =================
   MikroSim (MikrSimD) ist frei mikroprogrammierbar: Welcher Code welcher Befehl ist, legt das geladene
   Mikroprogramm (.mpd) fest – der Befehl beginnt an der gleichnamigen Mikroprogramm-Adresse.
   Dateien:  .mpd  Mikroprogramm (liefert die Befehlsnamen und damit die Codes)
             .ras  RAM als Assembler-Liste (Adresse, Opcode, Operand, Befehl)
             .rad  RAM als Hex-Tabelle (16 × 16, spaltenweise: Spalte = höheres Halbbyte)
   Der MikroSim-Rechner hat die Register AX und BX (BX ist zugleich Stapelzeiger und Indexregister),
   jeder Befehl ist 2 Byte lang (Code + Operand). In LOGHEX übernimmt A die Rolle von AX und der
   Stapelzeiger SP die Rolle von BX; jeder Befehl wird als Mikroprogramm aus LOGHEX-Mikroschritten gebaut.
   Bedingte Sprünge prüfen – wie in MikroSim – den aktuellen Wert von AX. */

// Befehlsliste des Mikroprogramms „CCAT-2014-03“ (Assembler.mpd), wird ohne eigene .mpd-Datei verwendet
const MS_DEFAULT = [[0x0A, 'mov AX, [nn]'], [0x0D, 'mov AX,[BX+nn]'], [0x10, 'mov AX, nn'], [0x11, 'mov [nn], AX'], [0x14, 'mov [BX+nn],AX'], [0x17, 'mov BX, nn'], [0x18, 'mov AX, BX'], [0x19, 'mov BX, AX'], [0x1A, 'SWAP AX,BX'], [0x1D, 'CLR [nn]'], [0x20, 'CLR [BX+nn]'], [0x25, 'ADD nn'], [0x26, 'ADD AX'], [0x28, 'ADD BX'], [0x2A, 'ADD [nn]'], [0x2D, 'ADD [BX+nn]'], [0x30, 'SUB nn'], [0x31, 'SUB AX'], [0x33, 'SUB BX'], [0x35, 'SUB [nn]'], [0x38, 'SUB [BX+nn]'], [0x3B, 'ADD BX, nn'], [0x3C, 'SUB BX, nn'], [0x3D, 'NEG AX'], [0x41, 'INC AX'], [0x42, 'DEC AX'], [0x43, 'INC BX'], [0x44, 'DEC BX'], [0x45, 'INC [nn]'], [0x4A, 'DEC [nn]'], [0x4F, 'INC [BX+nn]'], [0x54, 'DEC [BX+nn]'], [0x5B, 'JP nn'], [0x5C, 'JP [nn]'], [0x5F, 'JPS nn'], [0x62, 'JPNS nn'], [0x65, 'CALL nn'], [0x6D, 'RET'], [0x71, 'HALT'], [0x74, 'PUSH AX'], [0x78, 'POP AX'], [0x7B, 'ADDSTACK'], [0x83, 'SUBSTACK'], [0x8D, 'NEGSTACK'], [0x91, 'PUSH nn'], [0x94, 'PUSH [nn]'], [0x99, 'POP [nn]'], [0xA8, 'SWAPSTACK'], [0xB6, 'SWAPSTCK,AX'], [0xC0, 'JPZ nn'], [0xC7, 'JPNZ nn'], [0xFF, 'DEC IP']];

const msKey = s => String(s).toLowerCase().replace(/\s+/g, '');
/* Mikroprogramme der MikroSim-Befehle aus LOGHEX-Mikroschritten.
   O: Operand holen (DR := nn), RD: Speicherinhalt RAM[nn] holen, IX: MAR := BX + nn (AX bleibt erhalten),
   FL: Flags aus dem aktuellen AX bilden (die ALU reicht A unverändert durch, nichts auf dem Bus), P: Operandenbyte überspringen (PC + 1). */
function msTemplates() {
  const O = [{ src: 'PC', dst: ['MAR'] }, { rd: 1, inc: ['PC+'] }];
  const RD = [...O, { src: 'DR', dst: ['MAR'] }, { rd: 1 }];
  const IX = [...O, { src: 'DR', dst: ['B'] }, { src: 'A', dst: ['DR'] }, { src: 'SP', dst: ['A'] }, { alu: 'ADD', src: 'ALU', dst: ['MAR'] }, { src: 'DR', dst: ['A'] }];
  const IXRD = [...IX, { rd: 1 }];
  const FL = [{ alu: 'A', flags: 1 }];
  const AL = op => ({ alu: op, src: 'ALU', dst: ['A'], flags: 1 });
  const P = (m) => ({ ...m, inc: [...(m.inc || []), 'PC+'] });
  const memOp = (pre, op) => [...pre, { src: 'A', dst: ['B'] }, { src: 'DR', dst: ['A'] }, { alu: op, src: 'ALU', dst: ['DR'] }, { src: 'B', dst: ['A'] }, { wr: 1 }];
  const clr = pre => [...pre, { src: 'A', dst: ['B'] }, { alu: 'XOR', src: 'ALU', dst: ['DR'] }, { wr: 1 }];
  const bxOp = op => [...O, { src: 'DR', dst: ['B'] }, { src: 'A', dst: ['DR'] }, { src: 'SP', dst: ['A'] }, { alu: op, src: 'ALU', dst: ['SP'] }, { src: 'DR', dst: ['A'] }];
  const T = {
    'nop': ['NOP', 'keine Operation (2 Byte)', [P({})]],
    'movax,[nn]': ['adr', 'AX := RAM[nn]', [...RD, { src: 'DR', dst: ['A'] }]],
    'movax,[bx+nn]': ['adr', 'AX := RAM[BX + nn]', [...IXRD, { src: 'DR', dst: ['A'] }]],
    'movax,nn': ['imm', 'AX := nn', [...O, { src: 'DR', dst: ['A'] }]],
    'mov[nn],ax': ['adr', 'RAM[nn] := AX', [...O, { src: 'DR', dst: ['MAR'] }, { src: 'A', dst: ['DR'] }, { wr: 1 }]],
    'mov[bx+nn],ax': ['adr', 'RAM[BX + nn] := AX', [...IX, { src: 'A', dst: ['DR'] }, { wr: 1 }]],
    'movbx,nn': ['imm', 'BX := nn', [...O, { src: 'DR', dst: ['SP'] }]],
    'movax,bx': ['pad', 'AX := BX', [P({ src: 'SP', dst: ['A'] })]],
    'movbx,ax': ['pad', 'BX := AX', [P({ src: 'A', dst: ['SP'] })]],
    'swapax,bx': ['pad', 'AX und BX tauschen', [P({ src: 'A', dst: ['B'] }), { src: 'SP', dst: ['A'] }, { src: 'B', dst: ['SP'] }]],
    'clr[nn]': ['adr', 'RAM[nn] := 0', clr([...O, { src: 'DR', dst: ['MAR'] }])],
    'clr[bx+nn]': ['adr', 'RAM[BX + nn] := 0', clr(IX)],
    'addnn': ['imm', 'AX := AX + nn', [...O, { src: 'DR', dst: ['B'] }, AL('ADD')]],

/* Befehlssatz aus einer Befehlsliste [[Code, MikroSim-Schreibweise], …] bauen */
function msIsa(list) {
  const T = msTemplates(), isa = [], unknown = [];
  const seen = new Set();
  for (const [op, syn] of [[0x00, 'NOP'], ...list]) {
    if (seen.has(op)) continue;
    const t = T[msKey(syn)];
    if (!t) { unknown.push(hx(op) + ' ' + syn); continue; }
    seen.add(op);
    const [kind, desc, steps] = t;
    isa.push({ op, mn: 'M' + hx(op), mode: kind === 'none' ? 'none' : kind === 'adr' ? 'adr' : 'imm', syn: syn.replace(/\s+/g, ' ').trim(), desc: desc + (kind === 'pad' || kind === 'NOP' ? ' – das Operandenbyte wird übersprungen' : ''), steps: steps.map(ms), lock: true, ms: 1 });

const isMsIsa = (isa = CPU.isa) => isa.some(i => i.syn);
// Anzeigename eines Befehls: MikroSim-Schreibweise oder LOGHEX-Mnemonic mit Operandenart

/* --- Assembler: MikroSim-Schreibweise erkennen (z. B. „mov AX, [80]“, „JPZ 10“; Zahlen hexadezimal wie in MikroSim) --- */
function msAsmLine(s, labels) {
  const cands = [];
  for (const I of CPU.isa) {
    if (!I.syn) continue;
    const parts = I.syn.split(/nn/i);
    const esc2 = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s*').replace(/,/g, '\\s*,\\s*');
    const re = new RegExp('^' + parts.map(esc2).join('\\s*(.+?)\\s*') + '$', 'i');
    cands.push({ I, re, n: parts.length - 1, len: I.syn.length });
  }
  cands.sort((a, b) => a.n - b.n || b.len - a.len);   // zuerst Befehle ohne Operand, dann die längsten Muster
  for (const c of cands) {
    const m = s.replace(/\s+/g, ' ').trim().match(c.re); if (!m) continue;
    if (!c.n) return { I: c.I, v: 0 };
    const t = m[1].trim();
    let v;
    if (/^[0-9a-f]{1,2}$/i.test(t)) v = parseInt(t, 16);       // MikroSim: Zahlen sind hexadezimal
    else { try { v = parseNum(t, labels); } catch (e) { if (labels.__pass2 && /^[A-Za-z_]\w*$/.test(t)) throw e; continue; } }
    if (v < -128 || v > 255) throw new Error('Operand außerhalb 00…FF');
    return { I: c.I, v: v & 255 };
  }
  return null;
}

/* --- Dateien lesen --- */
function msParseMpd(text) {
  const rows = String(text).split(/\r?\n/), list = [];
  let fetchEnd = -1;
  for (const r of rows) {
    const m = /^([0-9A-Fa-f]{2}) (.{26})/.exec(r); if (!m) continue;
    const ad = parseInt(m[1], 16), name = m[2].trim(), sig = r.slice(29);
    if (!sig.includes('.')) continue;                 // Kopfzeile „AD Befehl 0 1 2 …“
    if (fetchEnd < 0 && /(^|\s)F(\s|$)/.test(sig.trim().split(/\s+/).slice(0, 16).join(' '))) fetchEnd = ad;   // Signal F = Befehl ausführen
    if (fetchEnd < 0) continue;                       // Holphase (MOV OP,[IP] … do command)
    if (ad <= fetchEnd || !name || /^[;*]/.test(name)) continue;
    list.push([ad, name]);
  }
  if (fetchEnd < 0) throw new Error('Das ist kein MikroSim-Mikroprogramm (die Holphase „do command“ fehlt).');
  return list;
}
function msParseRas(text) {
  const ram = new Uint8Array(256), names = new Map(), src = [];
  let any = false, next = 0;
  for (const raw of String(text).split(/\r?\n/)) {
    const r = raw.replace(/\s+$/, '');
    if (/^\s*;/.test(r)) { src.push(r); continue; }
    const m = /^([0-9A-Fa-f]{2})\s+([0-9A-Fa-f]{2})(?:\s+([0-9A-Fa-f]{2}))?(?:\s+(.*))?$/.exec(r.trim());
    if (!m) continue;
    const a = parseInt(m[1], 16), op = parseInt(m[2], 16), o = m[3] != null ? parseInt(m[3], 16) : null, txt = (m[4] || '').trim();
    ram[a] = op; if (o != null && a < 255) ram[a + 1] = o; any = true;
    if (a !== next) src.push(`\tORG ${hx(a)}`);
    if (txt) { if (!names.has(op)) names.set(op, txt.replace(/\s*,\s*/g, ', ').replace(/\[\s*[0-9A-Fa-f]{1,2}\s*\]/, '[nn]')); src.push('\t' + txt); }
    else src.push(`\tDB $${hx(op)}` + (o != null ? `, $${hx(o)}` : ''));
    next = a + (o != null ? 2 : 1);
  }
  if (!any) throw new Error('In der Datei wurde kein RAM-Inhalt gefunden.');
  return { ram, src: src.join('\n') + '\n' };
}
function msParseRad(text) {
  const ram = new Uint8Array(256); let rows = 0;
  for (const r of String(text).split(/\r?\n/)) {
    const m = /^([0-9A-Fa-f]{2})((?:\s+[0-9A-Fa-f]{2}){16})\s*$/.exec(r.trim()); if (!m) continue;
    const lo = parseInt(m[1], 16); if (lo > 15) continue;
    m[2].trim().split(/\s+/).forEach((v, hi) => { ram[hi * 16 + lo] = parseInt(v, 16); });
    rows++;
  }
  if (rows < 16) throw new Error('Die RAM-Tabelle ist unvollständig (16 Zeilen mit je 16 Werten erwartet).');
  return { ram };
}

async function msImport(f) {

  const ext = (/\.(\w+)$/.exec(f.name) || [])[1].toLowerCase();
  if (App.mode !== 'cpu') setMode('cpu');
  CPU.running = false;
  let note = '';
  if (ext === 'mpd') {
    const { isa, unknown } = msIsa(msParseMpd(text));
    CPU.isa = isa; CPU.msName = f.name;
    note = `<p>Der Befehlssatz aus dem Mikroprogramm „${esc(f.name)}“ ist jetzt aktiv: <b>${isa.length - 1} Befehle</b>.</p>` +
      (unknown.length ? `<p style="color:#c92a2a;font-size:13px">Nicht nachgebildet (unbekannte Befehle): ${unknown.map(esc).join(', ')}</p>` : '') +
      `<p style="font-size:13px;color:#667085">Lade nun ein Programm (.ras oder .rad) oder schreibe eines im Reiter <b>Assembler</b> in MikroSim-Schreibweise, z. B. <code>mov AX, [80]</code>.</p>`;
    CPU.tab = 'isa';
  } else {
    const r = ext === 'rad' ? msParseRad(text) : msParseRas(text);
    if (!isMsIsa()) { CPU.isa = msIsa(MS_DEFAULT).isa; CPU.msName = 'Standard-Mikroprogramm (CCAT-2014-03)'; note = `<p style="font-size:13px">Dafür wurde der <b>MikroSim-Befehlssatz</b> (${esc(CPU.msName)}) eingeschaltet. Ein eigenes Mikroprogramm (.mpd) kann ebenfalls geöffnet werden.</p>`; }
    CPU.ram.set(r.ram);
    if (r.src) { CPU.src = r.src; const as = assemble(CPU.src); CPU.listing = as; }
    CPU.tab = r.src ? 'asm' : 'ram';
    const used = new Set(); for (let a = 0; a < 256; a += 2) used.add(CPU.ram[a]);
    note = `<p>„${esc(f.name)}“ wurde in den Speicher geladen.</p>` + note;
  }
  CPU.hlLoaded = false; CPU.draft = null; CPU.editOp = null; cpuReset(false); cpuTabs(); cpuSave();
  openModal('MikroSim-Datei geöffnet', note + `<p style="font-size:13px;color:#667085">So wird übersetzt: <b>AX</b> ist der Akkumulator A, <b>BX</b> übernimmt der Stapelzeiger SP (in MikroSim ist BX zugleich Stapelzeiger und Indexregister). Jeder Befehl ist wie in MikroSim 2 Byte lang. Zurück zum LOGHEX-Befehlssatz geht es im Reiter <b>Befehlssatz</b> mit „Standard wiederherstellen“.</p>`);
}

function mkB(cc) {

    cc,
    add(type, x, y, o = {}) { const c = mkComp(type, x, y, cc); c.rot = o.r || 0; c.mir = !!o.m; Object.assign(c.props, o.p || {}); if (o.l !== undefined) c.label = o.l; if (o.st) Object.assign(c.st, o.st); cc.comps.push(c); return c; },
    w(...pts) { addPath(cc, pts); },
    module(exKey, name, sym, fn) {
      let M = App.modules.find(m => m.exKey === exKey);
      if (!M) {

}

document.addEventListener('pointerdown', e => { const m = $('.menu'); if (m && !m.contains(e.target) && e.target.closest('#bMore') == null) m.remove(); });
function menuAction(a) {
  if (a === 'syn') synthDialog();
  else if (a === 'task') createTaskDialog();
  else if (a === 'png') exportPNG();
  else if (a === 'svg') exportSVG();
  else if (a === 'print') printCircuit();
  else if (a === 'share') shareLink();
  else if (a === 'set') settingsDialog();
  else if (a === 'manual') window.open(MANUAL_URL, '_blank', 'noopener');
  else if (a === 'help') openModal('Hilfe & Bedienung', helpPanel() + `<div class="help"><h4>Handbuch</h4><p>Das ausführliche <a href="${MANUAL_URL}" target="_blank" rel="noopener"><b>Handbuch (PDF)</b></a> erklärt alle Bereiche und enthält Unterrichtsideen, Aufgabenvorschläge und ein Kapitel für Lehrkräfte. Es ist auch über <b>⋯ → Handbuch</b> erreichbar.</p><h4>Speichern</h4><p>Die Schaltungen werden automatisch im Browser gespeichert. Mit <b>Speichern</b> lädst du eine Datei herunter, die du mit <b>Öffnen</b> wieder laden oder weitergeben kannst. Über <b>⋯ → Link zum Teilen</b> entsteht ein Link, der die ganze Schaltung enthält (funktioniert, wenn das Programm auf einem Webserver liegt).</p><h4>Simulationsmodell</h4><p>Logikgatter werden ereignisorientiert simuliert; nicht angeschlossene Eingänge gelten als 0. Analoge Schaltungen werden mit der Knotenpotentialanalyse und dem Newton-Verfahren berechnet (wie in SPICE). Dioden und Transistoren folgen der Shockley- bzw. Ebers-Moll-Gleichung, der MOSFET dem quadratischen Modell.</p></div>`);
}
function settingsDialog() {
  const s = App.settings;
  openModal('Einstellungen', `<div class="set">
  <label>Schaltzeichen für Gatter<select id="sSym"><option value="din" ${s.symbols === 'din' ? 'selected' : ''}>DIN EN 60617 (rechteckig)</option><option value="ansi" ${s.symbols === 'ansi' ? 'selected' : ''}>ANSI / US (Formsymbole)</option></select></label>
  <label>Zeitlupe für Gatter (Gatterlaufzeit sichtbar machen)<input type="checkbox" id="sSlow" ${s.slow ? 'checked' : ''}></label>
  <label>Stromrichtung der Punkte<select id="sFlow"><option value="conv" ${s.flow === 'conv' ? 'selected' : ''}>technisch (+ → −)</option><option value="elec" ${s.flow === 'elec' ? 'selected' : ''}>Elektronenfluss (− → +)</option></select></label>
  <label>Stromfluss animieren<input type="checkbox" id="sDots" ${s.dots ? 'checked' : ''}></label>
  <label>Potentiale farbig darstellen<input type="checkbox" id="sCol" ${s.colorV ? 'checked' : ''}></label>
  <label>Beamer-Modus (dicke Linien, große Schrift)<input type="checkbox" id="sBeam" ${s.beamer ? 'checked' : ''}></label>
  <label>Hinweise zur Fehlersuche anzeigen<input type="checkbox" id="sHint" ${s.hints ? 'checked' : ''}></label>
  <label>Ton für den Summer<input type="checkbox" id="sSnd" ${s.sound ? 'checked' : ''}></label>
  <label>Werte an Bauteilen anzeigen<input type="checkbox" id="sVal" ${s.values ? 'checked' : ''}></label>
  <label>Simulationstempo (Kondensatoren)<select id="sSpd">${[[0.001, '0,001× (für kHz)'], [0.01, '0,01× (für 50 Hz)'], [0.05, '0,05×'], [0.1, '0,1× (Zeitlupe)'], [0.25, '0,25×'], [0.5, '0,5×'], [1, '1× (Echtzeit)'], [2, '2×'], [5, '5× (Zeitraffer)']].map(o => `<option value="${o[0]}" ${+s.speed === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label></div>`);
  const bind = (id, k, f = v => v) => { $('#' + id).onchange = e => { s[k] = f(e.target.type === 'checkbox' ? e.target.checked : e.target.value); scheduleSave(); buildPaletteIfNeeded(); }; };
  bind('sSym', 'symbols'); bind('sSlow', 'slow'); bind('sFlow', 'flow'); bind('sDots', 'dots'); bind('sCol', 'colorV'); bind('sVal', 'values'); bind('sSpd', 'speed', Number); bind('sBeam', 'beamer'); bind('sHint', 'hints'); bind('sSnd', 'sound');
}
function buildPaletteIfNeeded() { if (isCirc()) buildPalette(); }
function exportPNG() {
  const cc = circ(); if (!cc.comps.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const ext = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const c of cc.comps) { const b = DEFS[c.type].box(c); const p = xf(c, b[0], b[1]), q = xf(c, b[2], b[3]); ext(p.x, p.y); ext(q.x, q.y); for (const pp of pinsW(c)) ext(pp.x, pp.y); }
  for (const w of cc.wires) { ext(w.x1, w.y1); ext(w.x2, w.y2); }
  const pad = 2.5, sc = 2;
  const cn = document.createElement('canvas'); cn.width = (x1 - x0 + 2 * pad) * G * sc; cn.height = (y1 - y0 + 2 * pad) * G * sc;
  const sel = App.sel; App.sel = null;
  drawScene(cn.getContext('2d'), { view: { x: -(x0 - pad) * G, y: -(y0 - pad) * G, z: 1 }, scale: sc, grid: false, export: true });
  App.sel = sel;
  cn.toBlob(b => download('schaltung.png', b));
}
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const ub64 = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function encodeData(o) {
  const s = JSON.stringify(o);
  if (window.CompressionStream) { try { const st = new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer())); } catch (e) { } }
  return 'j' + b64u(new TextEncoder().encode(s));
}
async function decodeData(t) {
  if (t.length > LIMITS.hash) throw new Error('Link zu lang');
  const u = ub64(t.slice(1));
  if (t[0] === 'z') { const st = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return cleanData(JSON.parse(await readLimited(st, LIMITS.unzip))); }
  return cleanData(JSON.parse(new TextDecoder().decode(u)));
}
async function shareLink() {
  const code = await encodeData({ app: 'logix', version: 2, mode: App.mode, circuit: serialize(circ()), modules: App.mode === 'digital' ? modsForSave() : [] });
  let base = location.href.split('#')[0];
  const link = base + '#c=' + code;
  const local = !/^https?:/.test(location.protocol);
  openModal('Link zum Teilen', `<p style="font-size:14px;line-height:1.5">Dieser Link enthält die komplette Schaltung. ${local ? '<b>Hinweis:</b> Das Programm wurde als lokale Datei geöffnet – der Link funktioniert nur, wenn die HTML-Datei auf einem Webserver (z. B. Schulserver oder Moodle) liegt. Ersetze dann den vorderen Teil durch dessen Adresse.' : ''}</p><textarea class="share" readonly>${esc(link)}</textarea><div class="pbtns"><button class="btn pri" id="cpy">Kopieren</button></div>`);
  $('#cpy').onclick = async () => { const ta = $('textarea.share'); ta.select(); try { await navigator.clipboard.writeText(link); } catch (e) { document.execCommand && document.execCommand('copy'); } $('#cpy').textContent = 'Kopiert ✓'; };
}

$('#tRot').onclick = () => rotateSel(false);

$('#tRec').onclick = () => { const R = recM(); R.open = !R.open; recShow(); };

window.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (!isCirc()) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); updateToolbar(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); updateToolbar(); }
  else if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSel(); }
  else if (k === 'r' && !e.ctrlKey && !e.metaKey) rotateSel(false);
  else if (k === 'm' && !e.ctrlKey && !e.metaKey) rotateSel(true);
  else if (k === 'escape') { setPlacing(null); select(null); UI.selTool = false; updateToolbar(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'c') { copySel(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'x') { copySel(); deleteSel(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'v') { pasteClip(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); dupSel(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'a') { e.preventDefault(); selectAll(); }
  else if (k === 'enter' && App.editMod) finishEdit(true);
  else if (k === 'backspace' && App.inner.length && !App.sel) closeInner();
  else if (k === ' ') { e.preventDefault(); App.running = !App.running; updateToolbar(); }
});

/* --- automatisches Speichern im Browser --- */
let saveT = 0;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveLocal, 600); }
function saveLocal() {
  try { localStorage.setItem('logix.v1', JSON.stringify({ mode: App.mode, settings: App.settings, digital: baseCirc('digital'), modules: modsForSave(), task: App.task, analog: baseCirc('analog'), pn: { sub: PN.sub, type: PN.type } })); } catch (e) { }
}
function loadLocal() {
  try {
    const s = localStorage.getItem('logix.v1') || localStorage.getItem('schaltungslabor.v1'); if (!s) return null;
    return JSON.parse(s);
  } catch (e) { return null; }
}

/* --- Start --- */
async function init() {
  resize(); cpuInit();
  let st = loadLocal(), fromHash = null;
  if (location.hash.startsWith('#c=')) { try { fromHash = await decodeData(location.hash.slice(3)); } catch (e) { } }
  if (st) {
    if (isObj(st.settings)) for (const k of Object.keys(App.settings)) if (k in st.settings && typeof st.settings[k] === typeof App.settings[k]) App.settings[k] = typeof App.settings[k] === 'number' ? cleanNum(st.settings[k], App.settings[k]) : st.settings[k];
    mergeModules(st.modules); App.task = st.task ? cleanTask(st.task) : null;
    App.circ.digital = deserialize(st.digital || {}); App.circ.analog = deserialize(st.analog || {});
    if (st.pn) { PN.sub = st.pn.sub || PN.sub; PN.type = st.pn.type || PN.type; }
  }
  App.mode = st && st.mode ? st.mode : 'digital';
  if (fromHash && fromHash.circuit) { mergeModules(fromHash.modules); const m = fromHash.mode === 'analog' ? 'analog' : 'digital'; App.circ[m] = deserialize(fromHash.circuit); App.mode = m; history.replaceState(null, '', location.href.split('#')[0]); }
  setMode(App.mode);
  for (const m of ['digital', 'analog']) { const mm = App.mode; App.mode = m; fitView(); App.mode = mm; }
  if (App.mode !== 'pn') { App.netDirty = true; }
  requestAnimationFrame(frame);
}
